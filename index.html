<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Flores y Regalos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {                
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;                
            margin: 0;                
            padding: 0;                
            background-color: white;                
            padding-bottom: 70px;
        }

        /* --- Barra de Búsqueda --- */
        #search-bar {
            display: none;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* --- Estilo Pinterest (Masonry) --- */
        .pinterest-grid {                
            column-count: 2;
            column-gap: 8px;                
            padding: 8px;
        }

        .card {                
            background-color: white;                
            border-radius: 16px;                
            overflow: hidden;                
            margin-bottom: 8px;                
            break-inside: avoid;
            position: relative;
        }

        .card img {                
            width: 100%;                
            height: auto;                
            display: block;                
            border-radius: 16px;
        }
        
        /* --- Botón Borrar --- */
        .delete-btn {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
            line-height: 25px;
            text-align: center;
            z-index: 10;
        }

        /* --- Menú Inferior --- */
        .bottom-nav {                
            position: fixed;                
            bottom: 0;                
            left: 0;                
            width: 100%;                
            height: 65px;                
            background-color: white;                
            display: flex;                
            justify-content: space-around;                
            align-items: center;                
            border-top: 1px solid #e0e0e0;                
            z-index: 1000;
        }

        .nav-item {                
            text-decoration: none;                
            color: #555;                
            font-size: 24px;                
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        .nav-item.active {
            color: #e60023;
        }

        #file-input {
            display: none;
        }

        /* --- Modal de Login (Oculto) --- */
        #login-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2000;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        #login-modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        #login-modal button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .btn-login { background-color: #e60023; color: white; }
        .btn-cancel { background-color: #eee; color: #333; }
    </style>
</head>
<body>

    <input type="text" id="search-bar" placeholder="Buscar flores o regalos...">

    <div class="pinterest-grid" id="grid"></div>

    <div id="login-modal">
        <h3>Acceso Administrador</h3>
        <input type="email" id="admin-email" placeholder="Correo electrónico">
        <input type="password" id="admin-password" placeholder="Contraseña">
        <button class="btn-login" onclick="loginAdmin()">Entrar</button>
        <button class="btn-cancel" onclick="toggleLogin()">Cancelar</button>
    </div>

    <div class="bottom-nav">
        <a href="/" class="nav-item active"><i class="fas fa-house"></i></a>
        
        <a href="#" class="nav-item" onclick="toggleSearch()"><i class="fas fa-search"></i></a>
        
        <label for="file-input" class="nav-item" id="add-btn" style="display:none; cursor: pointer;">
            <i class="fas fa-plus"></i>
        </label>
        <input type="file" id="file-input" accept="image/*">
        
        <a href="https://wa.me/TUNUMERO" target="_blank" class="nav-item"><i class="fab fa-whatsapp"></i></a>
        
        <a href="#" class="nav-item" id="avatar-btn" onclick="toggleLogin()"><i class="fas fa-user"></i></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
        // Importar Auth
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        // !!! DATOS DE FIREBASE !!!
        const firebaseConfig = {
            apiKey: "AIzaSyDe6nwcA7ez_9qDPL6o_fGa0G3oxV6Vspk",
            authDomain: "flores-6df3b.firebaseapp.com",
            projectId: "flores-6df3b",
            storageBucket: "flores-6df3b.firebasestorage.app",
            messagingSenderId: "534385565327",
            appId: "1:534385565327:web:b4949f533d77e64b3b5afa",
            measurementId: "G-0L7KGNEW4K"
        };

        // DATOS DE CLOUDINARY
        const CLOUD_NAME = "dt4kgs8ge"; 
        const UPLOAD_PRESET = "FLORES"; 

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); // Inicializar Auth

        // --- PERSISTENCIA: Recordar inicio de sesión ---
        setPersistence(auth, browserLocalPersistence);

        const fileInput = document.getElementById('file-input');
        const grid = document.getElementById('grid');

        // --- GESTIÓN DE LOGIN ---
        window.toggleLogin = () => {
            const modal = document.getElementById('login-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        window.loginAdmin = () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("¡Sesión iniciada!");
                    toggleLogin();
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        }

        // --- VERIFICAR ESTADO DE AUTENTICACIÓN ---
        onAuthStateChanged(auth, (user) => {
            const addBtn = document.getElementById('add-btn');
            if (user) {
                // Usuario logueado: mostrar botón de añadir
                addBtn.style.display = 'flex';
                // Los botones de borrar se manejarán en toggleDeleteMode
            } else {
                // Usuario NO logueado: ocultar botón de añadir
                addBtn.style.display = 'none';
                // Asegurar que los botones de borrar no sean visibles
                document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'none');
            }
        });

        // --- CARGAR IMÁGENES A CLOUDINARY ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                // Subir a Cloudinary
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                // Guardar la URL optimizada en Firestore
                await addDoc(collection(db, "productos"), {
                    imageUrl: data.secure_url,
                    timestamp: new Date()
                });
                alert("¡Imagen subida con éxito!");
            } catch (error) {
                console.error("Error al subir:", error);
                alert("Error al subir imagen.");
            }
        });

        // --- MOSTRAR IMÁGENES EN TIEMPO REAL ---
        onSnapshot(collection(db, "productos"), (snapshot) => {
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const newCard = document.createElement('div');
                newCard.className = 'card';
                
                // Botón borrar
                newCard.innerHTML = `<button class="delete-btn" onclick="deleteCard('${doc.id}')">X</button>`;
                
                const newImg = document.createElement('img');
                newImg.src = data.imageUrl; // URL de Cloudinary
                
                newCard.appendChild(newImg);
                grid.prepend(newCard); // Añadir arriba
            });
        });

        // --- BORRAR IMÁGENES DE FIRESTORE ---
        window.deleteCard = async (docId) => {
            if(confirm("¿Eliminar este producto?")) {
                await deleteDoc(doc(db, "productos", docId));
            }
        }

        // --- UI (Búsqueda y modo borrar) ---
        window.toggleSearch = () => {
            const searchBar = document.getElementById('search-bar');
            searchBar.style.display = searchBar.style.display === 'block' ? 'none' : 'block';
            if (searchBar.style.display === 'block') searchBar.focus();
        }

        window.toggleDeleteMode = () => {
            // Solo permitir borrar si está logueado
            if (!auth.currentUser) {
                toggleLogin();
                return;
            }
            
            const buttons = document.getElementsByClassName('delete-btn');
            const avatar = document.getElementById('avatar-btn');
            let isDeleteMode = false;
            
            for (let btn of buttons) {
                btn.style.display = btn.style.display === 'block' ? 'none' : 'block';
                if (btn.style.display === 'block') isDeleteMode = true;
            }
            
            avatar.style.color = isDeleteMode ? '#e60023' : '#555';
        }
    </script>
</body>
</html>
