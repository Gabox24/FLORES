<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Flores y Regalos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {                
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;                
            margin: 0;                
            padding: 0;                
            background-color: white;                
            padding-bottom: 70px;
        }

        /* --- Barra de Búsqueda --- */
        #search-bar {
            display: none;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* --- Estilo Pinterest (Masonry) --- */
        .pinterest-grid {                
            column-count: 2;
            column-gap: 8px;                
            padding: 8px;
        }

        .card {                
            background-color: white;                
            border-radius: 16px;                
            overflow: hidden;                
            margin-bottom: 8px;                
            break-inside: avoid;
            position: relative;
        }

        .card img {                
            width: 100%;                
            height: auto;                
            display: block;                
            border-radius: 16px;
        }
        
        /* --- Botón Borrar --- */
        .delete-btn {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
            line-height: 25px;
            text-align: center;
            z-index: 10;
        }

        /* --- Menú Inferior --- */
        .bottom-nav {                
            position: fixed;                
            bottom: 0;                
            left: 0;                
            width: 100%;                
            height: 65px;                
            background-color: white;                
            display: flex;                
            justify-content: space-around;                
            align-items: center;                
            border-top: 1px solid #e0e0e0;                
            z-index: 1000;
        }

        .nav-item {                
            text-decoration: none;                
            color: #555;                
            font-size: 24px;                
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        .nav-item.active {
            color: #e60023;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <input type="text" id="search-bar" placeholder="Buscar flores o regalos...">

    <div class="pinterest-grid" id="grid"></div>

    <div class="bottom-nav">
        <a href="/" class="nav-item active"><i class="fas fa-house"></i></a>
        
        <a href="#" class="nav-item" onclick="toggleSearch()"><i class="fas fa-search"></i></a>
        
        <label for="file-input" class="nav-item" style="cursor: pointer;">
            <i class="fas fa-plus"></i>
        </label>
        <input type="file" id="file-input" accept="image/*">
        
        <a href="https://wa.me/TUNUMERO" target="_blank" class="nav-item"><i class="fab fa-whatsapp"></i></a>
        
        <a href="#" class="nav-item" id="avatar-btn" onclick="toggleDeleteMode()"><i class="fas fa-user"></i></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        // !!! PEGA TUS DATOS DE FIREBASE AQUÍ !!!
        const firebaseConfig = {
            apiKey: "...",
            authDomain: "...",
            projectId: "flores-6df3b",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };

        // DATOS DE CLOUDINARY
        const CLOUD_NAME = "dt4kgs8ge"; 
        const UPLOAD_PRESET = "FLORES"; 

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const fileInput = document.getElementById('file-input');
        const grid = document.getElementById('grid');

        // --- CARGAR IMÁGENES A CLOUDINARY ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                // Subir a Cloudinary
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                // Guardar la URL optimizada en Firestore
                await addDoc(collection(db, "productos"), {
                    imageUrl: data.secure_url,
                    timestamp: new Date()
                });
                alert("¡Imagen subida con éxito!");
            } catch (error) {
                console.error("Error al subir:", error);
                alert("Error al subir imagen.");
            }
        });

        // --- MOSTRAR IMÁGENES EN TIEMPO REAL ---
        onSnapshot(collection(db, "productos"), (snapshot) => {
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const newCard = document.createElement('div');
                newCard.className = 'card';
                
                // Botón borrar
                newCard.innerHTML = `<button class="delete-btn" onclick="deleteCard('${doc.id}')">X</button>`;
                
                const newImg = document.createElement('img');
                newImg.src = data.imageUrl; // URL de Cloudinary
                
                newCard.appendChild(newImg);
                grid.prepend(newCard); // Añadir arriba
            });
        });

        // --- BORRAR IMÁGENES DE FIRESTORE ---
        window.deleteCard = async (docId) => {
            if(confirm("¿Eliminar este producto?")) {
                await deleteDoc(doc(db, "productos", docId));
            }
        }

        // --- UI (Búsqueda y modo borrar) ---
        window.toggleSearch = () => {
            const searchBar = document.getElementById('search-bar');
            searchBar.style.display = searchBar.style.display === 'block' ? 'none' : 'block';
            if (searchBar.style.display === 'block') searchBar.focus();
        }

        window.toggleDeleteMode = () => {
            const buttons = document.getElementsByClassName('delete-btn');
            const avatar = document.getElementById('avatar-btn');
            let isDeleteMode = false;
            
            for (let btn of buttons) {
                btn.style.display = btn.style.display === 'block' ? 'none' : 'block';
                if (btn.style.display === 'block') isDeleteMode = true;
            }
            
            avatar.style.color = isDeleteMode ? '#e60023' : '#555';
        }
    </script>
</body>
</html>
